<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Social Post Builder — SuperMini Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f9;--ink:#161a20;--muted:#5e6776;--accent:#e8112d;--line:#e3e7ec;--font:'Inter',system-ui,sans-serif;--head:'Archivo','Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:16px}
header img{height:40px}
header h1{font-family:var(--head);font-size:1.1rem;font-weight:800}
header span{color:var(--muted);font-size:.85rem}
.app{display:grid;grid-template-columns:360px 1fr;gap:0;min-height:calc(100vh - 69px)}
.panel{background:#fff;border-right:1px solid var(--line);padding:20px;overflow-y:auto}
.stage{display:flex;align-items:center;justify-content:center;padding:28px;background:#e9edf2;overflow:auto}
.stage canvas{max-width:100%;max-height:calc(100vh - 130px);box-shadow:0 10px 40px rgba(0,0,0,.25);background:#111}
.group{margin-bottom:18px}
.group h3{font-family:var(--head);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
label{display:block;font-size:.8rem;color:var(--muted);margin:8px 0 4px}
input[type=text],select{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 11px;font:inherit;background:var(--bg)}
input[type=range]{width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 6px;font:inherit;font-weight:600;cursor:pointer;font-size:.8rem}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:6px;padding:13px;font:inherit;font-weight:800;font-family:var(--head);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:8px}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;font-size:.85rem}
.drop.over{border-color:var(--accent);color:var(--accent)}
.hint{font-size:.75rem;color:var(--muted);margin-top:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:820px){.app{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header><img src="../assets/logo-black.png" alt="SuperMini Challenge"><div><h1>Social Post Builder</h1><span>Drop a photo, pick a template, download the PNG.</span></div></header>

<div class="app">
<div class="panel">

  <div class="group">
    <h3>Photo</h3>
    <div class="drop" id="drop">Drop a photo here or click to choose</div>
    <input type="file" id="file" accept="image/*" hidden>
    <label>Zoom</label><input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
    <p class="hint">Drag the photo on the canvas to reposition it.</p>
  </div>

  <div class="group">
    <h3>Format</h3>
    <div class="seg" id="fmt">
      <button data-w="1080" data-h="1350" class="on">Instagram 4:5</button>
      <button data-w="1080" data-h="1080">Square</button>
      <button data-w="1080" data-h="1920">Story</button>
      <button data-w="1200" data-h="630">Facebook</button>
    </div>
  </div>

  <div class="group">
    <h3>Template</h3>
    <div class="seg" id="tpl">
      <button data-t="none">Photo only</button>
      <button data-t="pole" class="on">Pole position</button>
      <button data-t="race">Race winner</button>
      <button data-t="round">Round winner</button>
      <button data-t="result">Results</button>
    </div>
  </div>

  <div class="group" id="fields">
    <h3>Details</h3>
    <label>Driver</label><input type="text" id="driver" value="Josh Mills">
    <div class="row">
      <div><label>Car #</label><input type="text" id="car" value="3"></div>
      <div><label>Race (for race winner)</label><input type="text" id="race" value="Race 1"></div>
    </div>
    <label>Round</label><input type="text" id="round" value="Round 5 · Morgan Park">
    <label>Championship</label><input type="text" id="champ" value="Rubber Craft Queensland State Championship">
    <label>Line 2 (optional, e.g. lap time or 2nd/3rd)</label><input type="text" id="sub" value="">
    <label>Results list (results template, one per line: pos, name)</label>
    <textarea id="list" rows="5" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 11px;font:inherit;background:var(--bg)">1. Josh Mills
2. Trent Spencer
3. Zane Goddard</textarea>
  </div>

  <button class="btn btn-primary" id="dl">Download PNG</button>
  <p class="hint">Files are named by template, driver and format.</p>
</div>

<div class="stage"><canvas id="c" width="1080" height="1350"></canvas></div>
</div>

<script>
(function(){
const c=document.getElementById('c'),ctx=c.getContext('2d');
const ACCENT='#e8112d';
let img=null,logo=new Image(),tpl='pole',W=1080,H=1350,zoom=1,ox=0,oy=0,drag=null;
logo.src='../assets/logo-white.png';
logo.onload=draw;

// --- inputs
document.getElementById('drop').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>load(e.target.files[0]);
const drop=document.getElementById('drop');
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');load(e.dataTransfer.files[0])};
function load(f){if(!f)return;const i=new Image();i.onload=()=>{img=i;zoom=1;ox=oy=0;document.getElementById('zoom').value=1;draw()};i.src=URL.createObjectURL(f)}
document.getElementById('zoom').oninput=e=>{zoom=+e.target.value;draw()};
document.querySelectorAll('#fmt button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#fmt button').forEach(x=>x.classList.remove('on'));b.classList.add('on');W=+b.dataset.w;H=+b.dataset.h;c.width=W;c.height=H;ox=oy=0;draw()});
document.querySelectorAll('#tpl button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tpl button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tpl=b.dataset.t;draw()});
['driver','car','race','round','champ','sub','list'].forEach(id=>document.getElementById(id).oninput=draw);

// --- drag photo
c.onmousedown=e=>{drag={x:e.clientX,y:e.clientY,ox,oy}};
window.onmousemove=e=>{if(!drag)return;const s=W/c.getBoundingClientRect().width;ox=drag.ox+(e.clientX-drag.x)*s;oy=drag.oy+(e.clientY-drag.y)*s;draw()};
window.onmouseup=()=>drag=null;
c.ontouchstart=e=>{const t=e.touches[0];drag={x:t.clientX,y:t.clientY,ox,oy}};
c.ontouchmove=e=>{if(!drag)return;e.preventDefault();const t=e.touches[0];const s=W/c.getBoundingClientRect().width;ox=drag.ox+(t.clientX-drag.x)*s;oy=drag.oy+(t.clientY-drag.y)*s;draw()};
c.ontouchend=()=>drag=null;

const v=id=>document.getElementById(id).value.trim();
const head=(px,w=900)=>`${w} ${px}px Archivo, Inter, sans-serif`;
const body=(px,w=600)=>`${w} ${px}px Inter, sans-serif`;

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#161a20';ctx.fillRect(0,0,W,H);
  // photo, cover-fit with zoom/offset
  if(img){
    const s=Math.max(W/img.width,H/img.height)*zoom;
    const w=img.width*s,h=img.height*s;
    ctx.drawImage(img,(W-w)/2+ox,(H-h)/2+oy,w,h);
  }else{
    ctx.fillStyle='#2a2f38';ctx.font=body(Math.round(W*0.03));ctx.textAlign='center';ctx.fillText('Drop a photo',W/2,H/2);
  }
  if(tpl==='none'){logoMark();return;}

  // bottom gradient
  const gh=tpl==='result'?H*0.72:H*0.55;
  const g=ctx.createLinearGradient(0,H-gh,0,H);
  g.addColorStop(0,'rgba(11,13,17,0)');g.addColorStop(0.45,'rgba(11,13,17,.75)');g.addColorStop(1,'rgba(11,13,17,.96)');
  ctx.fillStyle=g;ctx.fillRect(0,H-gh,W,gh);
  logoMark();

  const m=Math.round(Math.min(W,H)*0.07);   // margin
  const base=Math.min(W,H)/1080;              // scale factor
  ctx.textAlign='left';ctx.textBaseline='alphabetic';

  if(tpl==='result'){
    let y=H-m;
    ctx.fillStyle='#cfd5de';ctx.font=body(Math.round(30*base),500);
    const metaLh=Math.round(40*base);
    const metaLines=wrapLines(v('round')+' · '+v('champ'),W-2*m);
    metaLines.slice().reverse().forEach((l,i)=>ctx.fillText(l,m,y-i*metaLh));
    y-=metaLines.length*metaLh+Math.round(24*base);
    const lines=v('list').split('\n').filter(Boolean).reverse();
    ctx.font=head(Math.round(56*base),800);
    lines.forEach(l=>{
      const mm=l.match(/^(\d+)[.)]?\s*(.*)$/);const pos=mm?mm[1]:'',name=mm?mm[2]:l;
      ctx.fillStyle=ACCENT;ctx.font=head(Math.round(56*base),800);ctx.fillText(pos,m,y);
      ctx.fillStyle='#fff';ctx.fillText(name,m+Math.round(84*base),y);
      y-=Math.round(72*base);
    });
    y-=Math.round(4*base);
    ctx.fillStyle=ACCENT;ctx.fillRect(m,y-Math.round(6*base),Math.round(70*base),Math.round(6*base));
    eyebrow('RESULTS · '+v('race').toUpperCase(),m,y-Math.round(22*base));
    carNumber(m,base);
    return;
  }

  const title={pole:'POLE POSITION',race:v('race').toUpperCase()+' WINNER',round:'ROUND WINNER'}[tpl];
  let y=H-m;
  // meta line(s), bottom-up
  ctx.fillStyle='#cfd5de';ctx.font=body(Math.round(30*base),500);
  const metaLh=Math.round(40*base);
  const metaLines=wrapLines(v('round')+' · '+v('champ'),W-2*m);
  metaLines.slice().reverse().forEach((l,i)=>ctx.fillText(l,m,y-i*metaLh));
  y-=metaLines.length*metaLh+Math.round(18*base);
  if(v('sub')){ctx.fillStyle='#fff';ctx.font=body(Math.round(36*base),600);ctx.fillText(v('sub'),m,y);y-=Math.round(56*base);}
  // driver name, big, wrapped, bottom-up
  const nameSize=Math.round((tpl==='round'?118:110)*base);
  ctx.fillStyle='#fff';ctx.font=head(nameSize,900);
  const nl=wrapLines(v('driver').toUpperCase(),W-2*m);
  nl.slice().reverse().forEach((l,i)=>ctx.fillText(l,m,y-i*nameSize*0.96));
  y-=(nl.length-1)*nameSize*0.96;         // baseline of the top name line
  const topOfName=y-nameSize*0.74;
  // red bar + eyebrow above the name
  const barY=topOfName-Math.round(22*base);
  ctx.fillStyle=ACCENT;ctx.fillRect(m,barY-Math.round(6*base),Math.round(70*base),Math.round(6*base));
  eyebrow(title,m,barY-Math.round(22*base));
  carNumber(m,base);
}
function carNumber(m,base){
  if(!v('car'))return;
  ctx.save();ctx.textAlign='right';ctx.textBaseline='alphabetic';ctx.fillStyle='#fff';
  ctx.font=head(Math.round(120*base),900);ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=24;
  ctx.fillText('#'+v('car'),W-m,m+Math.round(92*base));ctx.restore();
}
function eyebrow(t,x,y){ctx.fillStyle=ACCENT;ctx.font=head(Math.round(30*W/1080),800);ctx.save();ctx.letterSpacing=(Math.round(8*W/1080))+'px';ctx.fillText(t,x,y);ctx.restore();}
function logoMark(){if(!logo.complete||!logo.naturalWidth)return;const m=Math.round(W*0.06);const h=Math.round(W*0.11);const w=h*logo.naturalWidth/logo.naturalHeight;ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=18;ctx.drawImage(logo,m,m,w,h);ctx.restore();}
function wrapLines(t,maxw){const words=t.split(' '),out=[];let line='';words.forEach(w=>{const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxw&&line){out.push(line);line=w}else line=test});if(line)out.push(line);return out}
function wrap(t,x,y,maxw,lh,bottomUp){const ls=wrapLines(t,maxw);if(bottomUp){ls.reverse().forEach((l,i)=>ctx.fillText(l,x,y-i*lh))}else ls.forEach((l,i)=>ctx.fillText(l,x,y+i*lh))}

document.getElementById('dl').onclick=()=>{
  const a=document.createElement('a');
  const name=[tpl,v('driver')||'photo',W+'x'+H].join('-').toLowerCase().replace(/[^a-z0-9-]+/g,'-');
  a.download='smc-'+name+'.png';a.href=c.toDataURL('image/png');a.click();
};
document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
